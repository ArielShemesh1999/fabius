<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 452" width="1120" height="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1118" height="450" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- prompt -->
  <rect x="500" y="14" width="120" height="34" rx="17" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="560" y="36" text-anchor="middle" font-size="15" fill="#1f2328">your prompt</text>
  <line x1="560" y1="48" x2="560" y2="72" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- router -->
  <rect x="160" y="74" width="800" height="58" rx="11" fill="#1f6feb"/>
  <text x="560" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">fabius — the router</text>
  <text x="560" y="120" text-anchor="middle" font-size="12.5" fill="#cfe0ff">reads the job, sets the stance — dispatches by layer · machinery · model-tier</text>

  <!-- arrows router -> seven specialists -->
  <g stroke="#8c959f" stroke-width="2">
    <line x1="170" y1="132" x2="100"  y2="168" marker-end="url(#arrow)"/>
    <line x1="253" y1="132" x2="253"  y2="168" marker-end="url(#arrow)"/>
    <line x1="406" y1="132" x2="406"  y2="168" marker-end="url(#arrow)"/>
    <line x1="559" y1="132" x2="559"  y2="168" marker-end="url(#arrow)"/>
    <line x1="712" y1="132" x2="712"  y2="168" marker-end="url(#arrow)"/>
    <line x1="865" y1="132" x2="865"  y2="168" marker-end="url(#arrow)"/>
    <line x1="950" y1="132" x2="1018" y2="168" marker-end="url(#arrow)"/>
  </g>

  <!-- seven specialists -->
  <g font-size="12.5">
    <rect x="30"  y="170" width="140" height="86" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="100" y="200" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-disciplina</text>
    <text x="100" y="222" text-anchor="middle" font-size="10.5" fill="#57606a">process</text>
    <text x="100" y="240" text-anchor="middle" font-size="10.5" fill="#57606a">plan · test · prove</text>

    <rect x="183" y="170" width="140" height="86" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="253" y="200" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-decor</text>
    <text x="253" y="222" text-anchor="middle" font-size="10.5" fill="#57606a">design + data-viz</text>
    <text x="253" y="240" text-anchor="middle" font-size="10.5" fill="#57606a">tokens · charts</text>

    <rect x="336" y="170" width="140" height="86" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="406" y="200" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-cohors</text>
    <text x="406" y="222" text-anchor="middle" font-size="10.5" fill="#57606a">agents</text>
    <text x="406" y="240" text-anchor="middle" font-size="10.5" fill="#57606a">least-privilege</text>

    <rect x="489" y="170" width="140" height="86" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="559" y="200" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-archivum</text>
    <text x="559" y="222" text-anchor="middle" font-size="10.5" fill="#57606a">memory</text>
    <text x="559" y="240" text-anchor="middle" font-size="10.5" fill="#57606a">remember · recall</text>

    <rect x="642" y="170" width="140" height="86" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="712" y="200" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-mercatus</text>
    <text x="712" y="222" text-anchor="middle" font-size="10.5" fill="#57606a">marketing</text>
    <text x="712" y="240" text-anchor="middle" font-size="10.5" fill="#57606a">position · convert</text>

    <rect x="795" y="170" width="140" height="86" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="865" y="200" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-praesidium</text>
    <text x="865" y="222" text-anchor="middle" font-size="10.5" fill="#57606a">defensive security</text>
    <text x="865" y="240" text-anchor="middle" font-size="10.5" fill="#57606a">STRIDE · OWASP</text>

    <rect x="948" y="170" width="140" height="86" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="1018" y="200" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-ludus</text>
    <text x="1018" y="222" text-anchor="middle" font-size="10.5" fill="#57606a">games</text>
    <text x="1018" y="240" text-anchor="middle" font-size="10.5" fill="#57606a">loop · juice · feel</text>
  </g>

  <!-- arrows specialists -> lean core -->
  <g stroke="#8c959f" stroke-width="2">
    <line x1="100"  y1="256" x2="100"  y2="288" marker-end="url(#arrow)"/>
    <line x1="253"  y1="256" x2="253"  y2="288" marker-end="url(#arrow)"/>
    <line x1="406"  y1="256" x2="406"  y2="288" marker-end="url(#arrow)"/>
    <line x1="559"  y1="256" x2="559"  y2="288" marker-end="url(#arrow)"/>
    <line x1="712"  y1="256" x2="712"  y2="288" marker-end="url(#arrow)"/>
    <line x1="865"  y1="256" x2="865"  y2="288" marker-end="url(#arrow)"/>
    <line x1="1018" y1="256" x2="1018" y2="288" marker-end="url(#arrow)"/>
  </g>

  <!-- lean core -->
  <rect x="30" y="290" width="1058" height="54" rx="11" fill="#2ea44f"/>
  <text x="560" y="315" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">fabius-parcus — the lean core</text>
  <text x="560" y="334" text-anchor="middle" font-size="12.5" fill="#d7f4de">always on, runs beneath every layer: say less, build less</text>

  <line x1="560" y1="344" x2="560" y2="368" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- result -->
  <rect x="430" y="370" width="260" height="34" rx="17" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="560" y="392" text-anchor="middle" font-size="14" fill="#1f2328">the smallest correct result</text>

  <text x="560" y="430" text-anchor="middle" font-size="11.5" fill="#8c959f">depth in references/   ·   proof in evals/   ·   any tool via AGENTS.md</text>
</svg>
