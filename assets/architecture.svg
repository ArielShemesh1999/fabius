<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 512" width="1120" height="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1118" height="510" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- prompt -->
  <rect x="500" y="14" width="120" height="34" rx="17" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="560" y="36" text-anchor="middle" font-size="15" fill="#1f2328">your prompt</text>
  <line x1="560" y1="48" x2="560" y2="72" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- router -->
  <rect x="160" y="74" width="800" height="58" rx="11" fill="#1f6feb"/>
  <text x="560" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">fabius — the router</text>
  <text x="560" y="120" text-anchor="middle" font-size="12.5" fill="#cfe0ff">reads the job, sets the stance — dispatches by layer · machinery · model-tier</text>

  <!-- arrows router -> row 1 (5 specialists) -->
  <g stroke="#8c959f" stroke-width="2">
    <line x1="200" y1="132" x2="125" y2="164" marker-end="url(#arrow)"/>
    <line x1="360" y1="132" x2="342" y2="164" marker-end="url(#arrow)"/>
    <line x1="559" y1="132" x2="559" y2="164" marker-end="url(#arrow)"/>
    <line x1="760" y1="132" x2="776" y2="164" marker-end="url(#arrow)"/>
    <line x1="920" y1="132" x2="993" y2="164" marker-end="url(#arrow)"/>
  </g>

  <!-- ten specialists, two rows of five -->
  <g font-size="12.5">
    <!-- row 1 -->
    <rect x="30"  y="166" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="125" y="194" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-disciplina</text>
    <text x="125" y="214" text-anchor="middle" font-size="10.5" fill="#57606a">process</text>
    <text x="125" y="231" text-anchor="middle" font-size="10.5" fill="#57606a">plan · test · prove</text>

    <rect x="247" y="166" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="342" y="194" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-decor</text>
    <text x="342" y="214" text-anchor="middle" font-size="10.5" fill="#57606a">design + data-viz</text>
    <text x="342" y="231" text-anchor="middle" font-size="10.5" fill="#57606a">tokens · charts · imagery</text>

    <rect x="464" y="166" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="559" y="194" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-cohors</text>
    <text x="559" y="214" text-anchor="middle" font-size="10.5" fill="#57606a">agents</text>
    <text x="559" y="231" text-anchor="middle" font-size="10.5" fill="#57606a">least-privilege</text>

    <rect x="681" y="166" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="776" y="194" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-archivum</text>
    <text x="776" y="214" text-anchor="middle" font-size="10.5" fill="#57606a">memory</text>
    <text x="776" y="231" text-anchor="middle" font-size="10.5" fill="#57606a">remember · auto-recall</text>

    <rect x="898" y="166" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="993" y="194" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-mercatus</text>
    <text x="993" y="214" text-anchor="middle" font-size="10.5" fill="#57606a">marketing</text>
    <text x="993" y="231" text-anchor="middle" font-size="10.5" fill="#57606a">position · convert</text>

    <!-- row 2 -->
    <rect x="30"  y="262" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="125" y="290" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-praesidium</text>
    <text x="125" y="310" text-anchor="middle" font-size="10.5" fill="#57606a">defensive security</text>
    <text x="125" y="327" text-anchor="middle" font-size="10.5" fill="#57606a">STRIDE · OWASP</text>

    <rect x="247" y="262" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="342" y="290" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-ludus</text>
    <text x="342" y="310" text-anchor="middle" font-size="10.5" fill="#57606a">games</text>
    <text x="342" y="327" text-anchor="middle" font-size="10.5" fill="#57606a">loop · juice · feel</text>

    <rect x="464" y="262" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="559" y="290" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-catena</text>
    <text x="559" y="310" text-anchor="middle" font-size="10.5" fill="#57606a">on-chain + sealing</text>
    <text x="559" y="327" text-anchor="middle" font-size="10.5" fill="#57606a">validate · prove</text>

    <rect x="681" y="262" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="776" y="290" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-machina</text>
    <text x="776" y="310" text-anchor="middle" font-size="10.5" fill="#57606a">automation</text>
    <text x="776" y="327" text-anchor="middle" font-size="10.5" fill="#57606a">wire · verify · activate</text>

    <rect x="898" y="262" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="993" y="290" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-scientia</text>
    <text x="993" y="310" text-anchor="middle" font-size="10.5" fill="#57606a">science</text>
    <text x="993" y="327" text-anchor="middle" font-size="10.5" fill="#57606a">hypothesis · evidence</text>
  </g>

  <!-- connectors row1 -> row2 -->
  <g stroke="#d0d7de" stroke-width="2">
    <line x1="125" y1="246" x2="125" y2="262"/>
    <line x1="342" y1="246" x2="342" y2="262"/>
    <line x1="559" y1="246" x2="559" y2="262"/>
    <line x1="776" y1="246" x2="776" y2="262"/>
    <line x1="993" y1="246" x2="993" y2="262"/>
  </g>

  <!-- arrows row 2 -> lean core -->
  <g stroke="#8c959f" stroke-width="2">
    <line x1="125" y1="342" x2="125" y2="372" marker-end="url(#arrow)"/>
    <line x1="342" y1="342" x2="342" y2="372" marker-end="url(#arrow)"/>
    <line x1="559" y1="342" x2="559" y2="372" marker-end="url(#arrow)"/>
    <line x1="776" y1="342" x2="776" y2="372" marker-end="url(#arrow)"/>
    <line x1="993" y1="342" x2="993" y2="372" marker-end="url(#arrow)"/>
  </g>

  <!-- lean core -->
  <rect x="30" y="374" width="1058" height="54" rx="11" fill="#2ea44f"/>
  <text x="560" y="399" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">fabius-parcus — the lean core</text>
  <text x="560" y="418" text-anchor="middle" font-size="12.5" fill="#d7f4de">always on, runs beneath every layer: say less, build less</text>

  <line x1="560" y1="428" x2="560" y2="452" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- result -->
  <rect x="430" y="454" width="260" height="34" rx="17" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="560" y="476" text-anchor="middle" font-size="14" fill="#1f2328">the smallest correct result</text>

  <text x="560" y="504" text-anchor="middle" font-size="11.5" fill="#8c959f">depth in references/   ·   proof in evals/   ·   provenance in PROVENANCE.md   ·   any tool via AGENTS.md</text>
</svg>
