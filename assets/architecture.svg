  <!-- connectors row1 -> row2 -->
  <g stroke="#d0d7de" stroke-width="2">
    <line x1="114"  y1="246" x2="114"  y2="262"/>
    <line x1="292"  y1="246" x2="292"  y2="262"/>
    <line x1="470"  y1="246" x2="470"  y2="262"/>
    <line x1="648"  y1="246" x2="648"  y2="262"/>
    <line x1="826"  y1="246" x2="826"  y2="262"/>
    <line x1="1004" y1="246" x2="1004" y2="262"/>
  </g>

  <!-- arrows row 2 -> lean core -->
  <g stroke="#8c959f" stroke-width="2">
    <line x1="114"  y1="342" x2="114"  y2="372" marker-end="url(#arrow)"/>
    <line x1="292"  y1="342" x2="292"  y2="372" marker-end="url(#arrow)"/>
    <line x1="470"  y1="342" x2="470"  y2="372" marker-end="url(#arrow)"/>
    <line x1="648"  y1="342" x2="648"  y2="372" marker-end="url(#arrow)"/>
    <line x1="826"  y1="342" x2="826"  y2="372" marker-end="url(#arrow)"/>
    <line x1="1004" y1="342" x2="1004" y2="372" marker-end="url(#arrow)"/>
  </g>

  <!-- lean core -->
  <rect x="30" y="374" width="1058" height="54" rx="11" fill="#2ea44f"/>
  <text x="560" y="399" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">fabius-parcus — the lean core</text>
  <text x="560" y="418" text-anchor="middle" font-size="12.5" fill="#d7f4de">always on, runs beneath every layer: say less, build less</text>

  <line x1="560" y1="428" x2="560" y2="452" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- result -->
  <rect x="430" y="454" width="260" height="34" rx="17" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="560" y="476" text-anchor="middle" font-size="14" fill="#1f2328">the smallest correct result</text>

  <text x="560" y="504" text-anchor="middle" font-size="11.5" fill="#8c959f">depth in references/   ·   proof in evals/   ·   provenance in PROVENANCE.md   ·   any tool via AGENTS.md</text>
</svg>
