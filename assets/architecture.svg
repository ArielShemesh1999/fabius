<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="858" height="478" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- prompt -->
  <rect x="375" y="22" width="110" height="38" rx="19" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="430" y="46" text-anchor="middle" font-size="15" fill="#1f2328">your prompt</text>
  <line x1="430" y1="60" x2="430" y2="86" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- router -->
  <rect x="150" y="88" width="560" height="62" rx="11" fill="#1f6feb"/>
  <text x="430" y="114" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">fabius — the router</text>
  <text x="430" y="135" text-anchor="middle" font-size="13" fill="#cfe0ff">reads the job, sets the stance, picks the layer that fits</text>

  <!-- arrows router -> specialists -->
  <line x1="430" y1="150" x2="120" y2="196" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="150" x2="326" y2="196" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="150" x2="534" y2="196" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="150" x2="740" y2="196" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- specialists -->
  <g font-size="14">
    <rect x="25"  y="198" width="190" height="86" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="120" y="226" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-disciplina</text>
    <text x="120" y="247" text-anchor="middle" font-size="12.5" fill="#57606a">process</text>
    <text x="120" y="268" text-anchor="middle" font-size="12.5" fill="#57606a">plan, test, prove</text>

    <rect x="231" y="198" width="190" height="86" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="326" y="226" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-decor</text>
    <text x="326" y="247" text-anchor="middle" font-size="12.5" fill="#57606a">design</text>
    <text x="326" y="268" text-anchor="middle" font-size="12.5" fill="#57606a">tokens, mobile-first</text>

    <rect x="437" y="198" width="190" height="86" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="532" y="226" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-cohors</text>
    <text x="532" y="247" text-anchor="middle" font-size="12.5" fill="#57606a">agents</text>
    <text x="532" y="268" text-anchor="middle" font-size="12.5" fill="#57606a">least-privilege, swarm</text>

    <rect x="643" y="198" width="190" height="86" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="738" y="226" text-anchor="middle" font-weight="700" fill="#1f2328">fabius-archivum</text>
    <text x="738" y="247" text-anchor="middle" font-size="12.5" fill="#57606a">memory</text>
    <text x="738" y="268" text-anchor="middle" font-size="12.5" fill="#57606a">remember, recall</text>
  </g>

  <!-- arrows specialists -> lean core -->
  <line x1="120" y1="284" x2="120" y2="320" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="326" y1="284" x2="326" y2="320" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="532" y1="284" x2="532" y2="320" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="738" y1="284" x2="738" y2="320" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- lean core -->
  <rect x="25" y="322" width="808" height="58" rx="11" fill="#2ea44f"/>
  <text x="430" y="347" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">fabius-parcus — the lean core</text>
  <text x="430" y="367" text-anchor="middle" font-size="13" fill="#d7f4de">always on, runs beneath every layer: say less, build less</text>

  <line x1="430" y1="380" x2="430" y2="406" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- result -->
  <rect x="300" y="408" width="260" height="38" rx="19" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="430" y="432" text-anchor="middle" font-size="14" fill="#1f2328">the smallest correct result</text>

  <text x="430" y="468" text-anchor="middle" font-size="11.5" fill="#8c959f">depth in references/   ·   proof in evals/   ·   any tool via AGENTS.md</text>
</svg>
