name: verify repository artifact

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*-sealed']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2, pinned to the official tag commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-node v4.4.0, pinned to the official tag commit.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify unreleased development tree
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: bash scripts/verify-all.sh --mode=dev

      - name: Verify signed release tree
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: bash scripts/verify-all.sh --mode=release
