name: Documentation correction
description: A measured claim — benchmark figure, test count, model roster, proof class — that does not hold
labels: [documentation]
body:
  - type: input
    id: claim
    attributes:
      label: The claim, and where it appears
      placeholder: README says 71 tests; runtime reports 75
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Why it is wrong
      description: What you ran or read that contradicts it. Corrections of this kind are the most valuable issue this repo receives.
    validations:
      required: true
