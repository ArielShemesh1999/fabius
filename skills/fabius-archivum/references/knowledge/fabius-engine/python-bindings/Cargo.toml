[package]
name = "fabius-vec-python"
version = "0.8.0"
edition = "2021"
rust-version = "1.70"

[lib]
name = "_fabius-vec"
crate-type = ["cdylib"]

[dependencies]
fabius-vec-core = { package = "fabius-vec", path = "../fabius-vec" }
pyo3 = { version = "0.27.0", features = ["extension-module", "abi3-py39"] }
numpy = "0.27.0"

[build-dependencies]
pyo3-build-config = "0.27.0"
